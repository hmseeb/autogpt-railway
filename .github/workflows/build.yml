name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  UPSTREAM_TAG: autogpt-platform-beta-v0.7.0
  REGISTRY: ghcr.io/hmseeb

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Significant-Gravitas/AutoGPT
          ref: autogpt-platform-beta-v0.7.0
          path: upstream
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build upstream server target
        uses: docker/build-push-action@v6
        with:
          context: upstream
          file: upstream/autogpt_platform/backend/Dockerfile
          target: server
          load: true
          tags: agpt-backend-base:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build Railway overlay
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          build-args: BASE_IMAGE=agpt-backend-base:ci
          load: true
          tags: autogpt-railway-backend:test
      - name: Contract test
        run: BACKEND_IMAGE=autogpt-railway-backend:test ./test/backend.sh
      - name: Push
        run: |
          docker tag autogpt-railway-backend:test $REGISTRY/autogpt-railway-backend:$UPSTREAM_TAG
          docker tag autogpt-railway-backend:test $REGISTRY/autogpt-railway-backend:latest
          docker push $REGISTRY/autogpt-railway-backend:$UPSTREAM_TAG
          docker push $REGISTRY/autogpt-railway-backend:latest

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Significant-Gravitas/AutoGPT
          ref: autogpt-platform-beta-v0.7.0
          path: upstream
      - name: Bake sentinel env for the client bundle
        run: |
          cat > upstream/autogpt_platform/frontend/.env.production <<'EOF'
          NEXT_PUBLIC_AGPT_SERVER_URL=https://sentinel-backend.railway-template.invalid/api
          NEXT_PUBLIC_AGPT_WS_SERVER_URL=wss://sentinel-backend.railway-template.invalid/ws
          NEXT_PUBLIC_FRONTEND_BASE_URL=https://sentinel-frontend.railway-template.invalid
          NEXT_PUBLIC_APP_ENV=local
          NEXT_PUBLIC_BEHAVE_AS=LOCAL
          NEXT_PUBLIC_LAUNCHDARKLY_ENABLED=false
          NEXT_PUBLIC_TURNSTILE=disabled
          NEXT_PUBLIC_REACT_QUERY_DEVTOOL=false
          EOF
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build upstream prod target
        uses: docker/build-push-action@v6
        with:
          context: upstream
          file: upstream/autogpt_platform/frontend/Dockerfile
          target: prod
          load: true
          tags: agpt-frontend-base:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Build Railway overlay
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          build-args: BASE_IMAGE=agpt-frontend-base:ci
          load: true
          tags: autogpt-railway-frontend:test
      - name: Contract test
        run: FRONTEND_IMAGE=autogpt-railway-frontend:test ./test/frontend.sh
      - name: Push
        run: |
          docker tag autogpt-railway-frontend:test $REGISTRY/autogpt-railway-frontend:$UPSTREAM_TAG
          docker tag autogpt-railway-frontend:test $REGISTRY/autogpt-railway-frontend:latest
          docker push $REGISTRY/autogpt-railway-frontend:$UPSTREAM_TAG
          docker push $REGISTRY/autogpt-railway-frontend:latest
